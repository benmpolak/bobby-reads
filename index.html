<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bobby’s Big Adventure · Read & Play</title>
<meta name="theme-color" content="#152d40">
<meta name="description" content="Reading adventures, number missions and curious discoveries for Bobby.">

<style>
  :root{
    --ink:#1b2a4a; --paper:#faf6ef; --card:#ffffff;
    --blue:#2244bb; --blue-soft:#e8edfb;
    --amber:#f5a623; --green:#3aa76d; --red:#d9534f;
    --radius:22px;
    --shadow:0 4px 14px rgba(27,42,74,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",Quicksand,Nunito,"Comic Sans MS",sans-serif;
    min-height:100%;}
  button{font-family:inherit; color:inherit; border:none; cursor:pointer; background:none;}

  #app{max-width:760px; margin:0 auto; padding:14px 16px 40px;}

  /* top bar */
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 14px;}
  .home-btn{font-size:17px; font-weight:800; background:var(--card); border-radius:999px;
    padding:10px 18px; box-shadow:var(--shadow);}
  .home-btn:active{transform:scale(.96);}
  .starpill{font-size:17px; font-weight:800; background:var(--card); border-radius:999px;
    padding:10px 18px; box-shadow:var(--shadow); color:var(--ink);}
  .starpill .s{color:var(--amber);}

  h1{font-size:30px; margin:6px 0 2px; letter-spacing:-.5px;}
  .subtitle{margin:0 0 18px; font-size:16px; opacity:.65; font-weight:600;}
  h2{font-size:21px; margin:26px 0 12px;}

  /* bookshelf */
  .shelf{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px;}
  .cover{border-radius:var(--radius); padding:18px 14px 14px; min-height:190px; color:#fff;
    display:flex; flex-direction:column; justify-content:space-between; box-shadow:var(--shadow);
    text-align:left; position:relative; overflow:hidden;}
  .cover:active{transform:scale(.97);}
  .cover .emoji{font-size:52px; line-height:1;}
  .cover .t{font-size:19px; font-weight:800; line-height:1.15; margin-top:10px; text-shadow:0 1px 3px rgba(0,0,0,.25);}
  .cover .badge{position:absolute; top:10px; right:10px; background:rgba(255,255,255,.92); color:var(--ink);
    font-size:12px; font-weight:800; padding:4px 9px; border-radius:999px;}
  .cover .lvl{position:absolute; top:10px; left:10px; background:rgba(0,0,0,.28); color:#fff;
    font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; letter-spacing:.02em;}

  /* big menu buttons */
  .bigrow{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:480px){.bigrow{grid-template-columns:1fr 1fr;}}
  .bigbtn{background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);
    text-align:left; font-weight:800; font-size:17px;}
  .bigbtn .em{font-size:34px; display:block; margin-bottom:8px;}
  .bigbtn:active{transform:scale(.97);}

  /* reading page */
  .bookpage{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:34px 28px; min-height:340px; display:flex; flex-direction:column; justify-content:center;}
  .pagetext{font-size:34px; line-height:1.7; font-weight:700; text-align:center;}
  @media(max-width:480px){.pagetext{font-size:27px;}}
  .pagetext .w{border-radius:10px; padding:1px 4px; margin:0 -1px; display:inline-block;}
  .pagetext .w:active, .pagetext .w.lit{background:var(--amber); color:#fff;}
  .pageart{text-align:center; font-size:64px; margin-bottom:18px;}

  .pagecontrols{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px;}
  .navbtn{background:var(--card); box-shadow:var(--shadow); border-radius:999px; width:62px; height:62px;
    font-size:26px; font-weight:800; flex-shrink:0;}
  .navbtn:disabled{opacity:.25;}
  .navbtn:active:not(:disabled){transform:scale(.94);}
  .hearbtn{background:var(--blue); color:#fff; border-radius:999px; padding:16px 26px;
    font-size:18px; font-weight:800; box-shadow:var(--shadow);}
  .hearbtn:active{transform:scale(.96);}
  .dots{text-align:center; margin-top:16px; font-size:0;}
  .dots i{display:inline-block; width:10px; height:10px; border-radius:50%; background:#d8d2c6; margin:0 4px;}
  .dots i.on{background:var(--blue);}

  /* new-words intro */
  .newwords{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:22px 0;}
  .nw{background:var(--blue-soft); color:var(--blue); border-radius:16px; padding:14px 22px;
    font-size:26px; font-weight:800;}
  .nw:active{transform:scale(.95); background:var(--blue); color:#fff;}
  .hint{text-align:center; opacity:.6; font-weight:600; font-size:15px; margin-top:14px;}

  /* games */
  .gamecard{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:34px 24px; text-align:center;}
  .bigword{font-size:54px; font-weight:800; letter-spacing:2px; margin:10px 0 24px;}
  @media(max-width:480px){.bigword{font-size:42px;}}
  .soundbtns{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:26px;}
  .sb{background:var(--blue-soft); color:var(--blue); font-size:38px; font-weight:800;
    border-radius:16px; padding:14px 18px; min-width:64px;}
  .sb.lit{background:var(--amber); color:#fff;}
  .sb:active{transform:scale(.93);}
  @media(max-width:480px){.sb{font-size:30px; padding:12px 14px; min-width:54px;}}
  .answerrow{display:flex; gap:12px; justify-content:center; margin-top:8px; flex-wrap:wrap;}
  .ans{border-radius:999px; padding:16px 28px; font-size:18px; font-weight:800; box-shadow:var(--shadow); color:#fff;}
  .ans.good{background:var(--green);}
  .ans.again{background:#9aa3b5;}
  .ans.real{background:var(--green);}
  .ans.alien{background:#8a4fd3;}
  .ans:active{transform:scale(.95);}
  .feedback{min-height:34px; font-size:21px; font-weight:800; margin-top:18px;}
  .feedback.good{color:var(--green);}
  .feedback.bad{color:var(--red);}

  .levelrow{display:flex; gap:10px; margin:4px 0 20px;}
  .lvl{flex:1; background:var(--card); border-radius:999px; padding:12px; font-weight:800;
    font-size:16px; box-shadow:var(--shadow); opacity:.55;}
  .lvl.on{opacity:1; background:var(--blue); color:#fff;}

  .streak{font-weight:800; opacity:.55; font-size:15px; margin-top:14px;}

  /* finish screen */
  .finish{text-align:center; padding:40px 20px;}
  .finish .big{font-size:80px;}
  .finish h2{font-size:28px;}

  /* confetti */
  .confetti{position:fixed; width:12px; height:12px; top:-20px; z-index:99; border-radius:3px; pointer-events:none;
    animation:fall 1.6s ease-in forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg); opacity:.7;}}
</style>
<link rel="stylesheet" href="adventure.css?v=4">
</head>
<body>
<div id="app"></div>
<script src="legacy.js?v=4"></script>
<script src="engine.js?v=4"></script>
<script src="maths-quests.js?v=4"></script>
<script src="adventure.js?v=4"></script>
</body>
</html>
