<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bobby Reads</title>
<style>
  :root{
    --ink:#1b2a4a; --paper:#faf6ef; --card:#ffffff;
    --blue:#2244bb; --blue-soft:#e8edfb;
    --amber:#f5a623; --green:#3aa76d; --red:#d9534f;
    --radius:22px;
    --shadow:0 4px 14px rgba(27,42,74,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",Quicksand,Nunito,"Comic Sans MS",sans-serif;
    min-height:100%;}
  button{font-family:inherit; color:inherit; border:none; cursor:pointer; background:none;}

  #app{max-width:760px; margin:0 auto; padding:14px 16px 40px;}

  /* top bar */
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 14px;}
  .home-btn{font-size:17px; font-weight:800; background:var(--card); border-radius:999px;
    padding:10px 18px; box-shadow:var(--shadow);}
  .home-btn:active{transform:scale(.96);}
  .starpill{font-size:17px; font-weight:800; background:var(--card); border-radius:999px;
    padding:10px 18px; box-shadow:var(--shadow); color:var(--ink);}
  .starpill .s{color:var(--amber);}

  h1{font-size:30px; margin:6px 0 2px; letter-spacing:-.5px;}
  .subtitle{margin:0 0 18px; font-size:16px; opacity:.65; font-weight:600;}
  h2{font-size:21px; margin:26px 0 12px;}

  /* bookshelf */
  .shelf{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px;}
  .cover{border-radius:var(--radius); padding:18px 14px 14px; min-height:190px; color:#fff;
    display:flex; flex-direction:column; justify-content:space-between; box-shadow:var(--shadow);
    text-align:left; position:relative; overflow:hidden;}
  .cover:active{transform:scale(.97);}
  .cover .emoji{font-size:52px; line-height:1;}
  .cover .t{font-size:19px; font-weight:800; line-height:1.15; margin-top:10px; text-shadow:0 1px 3px rgba(0,0,0,.25);}
  .cover .badge{position:absolute; top:10px; right:10px; background:rgba(255,255,255,.92); color:var(--ink);
    font-size:12px; font-weight:800; padding:4px 9px; border-radius:999px;}

  /* big menu buttons */
  .bigrow{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:480px){.bigrow{grid-template-columns:1fr 1fr;}}
  .bigbtn{background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);
    text-align:left; font-weight:800; font-size:17px;}
  .bigbtn .em{font-size:34px; display:block; margin-bottom:8px;}
  .bigbtn:active{transform:scale(.97);}

  /* reading page */
  .bookpage{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:34px 28px; min-height:340px; display:flex; flex-direction:column; justify-content:center;}
  .pagetext{font-size:34px; line-height:1.7; font-weight:700; text-align:center;}
  @media(max-width:480px){.pagetext{font-size:27px;}}
  .pagetext .w{border-radius:10px; padding:1px 4px; margin:0 -1px; display:inline-block;}
  .pagetext .w:active, .pagetext .w.lit{background:var(--amber); color:#fff;}
  .pageart{text-align:center; font-size:64px; margin-bottom:18px;}

  .pagecontrols{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px;}
  .navbtn{background:var(--card); box-shadow:var(--shadow); border-radius:999px; width:62px; height:62px;
    font-size:26px; font-weight:800; flex-shrink:0;}
  .navbtn:disabled{opacity:.25;}
  .navbtn:active:not(:disabled){transform:scale(.94);}
  .hearbtn{background:var(--blue); color:#fff; border-radius:999px; padding:16px 26px;
    font-size:18px; font-weight:800; box-shadow:var(--shadow);}
  .hearbtn:active{transform:scale(.96);}
  .dots{text-align:center; margin-top:16px; font-size:0;}
  .dots i{display:inline-block; width:10px; height:10px; border-radius:50%; background:#d8d2c6; margin:0 4px;}
  .dots i.on{background:var(--blue);}

  /* new-words intro */
  .newwords{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:22px 0;}
  .nw{background:var(--blue-soft); color:var(--blue); border-radius:16px; padding:14px 22px;
    font-size:26px; font-weight:800;}
  .nw:active{transform:scale(.95); background:var(--blue); color:#fff;}
  .hint{text-align:center; opacity:.6; font-weight:600; font-size:15px; margin-top:14px;}

  /* games */
  .gamecard{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:34px 24px; text-align:center;}
  .bigword{font-size:54px; font-weight:800; letter-spacing:2px; margin:10px 0 24px;}
  @media(max-width:480px){.bigword{font-size:42px;}}
  .soundbtns{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:26px;}
  .sb{background:var(--blue-soft); color:var(--blue); font-size:38px; font-weight:800;
    border-radius:16px; padding:14px 18px; min-width:64px;}
  .sb.lit{background:var(--amber); color:#fff;}
  .sb:active{transform:scale(.93);}
  @media(max-width:480px){.sb{font-size:30px; padding:12px 14px; min-width:54px;}}
  .answerrow{display:flex; gap:12px; justify-content:center; margin-top:8px; flex-wrap:wrap;}
  .ans{border-radius:999px; padding:16px 28px; font-size:18px; font-weight:800; box-shadow:var(--shadow); color:#fff;}
  .ans.good{background:var(--green);}
  .ans.again{background:#9aa3b5;}
  .ans.real{background:var(--green);}
  .ans.alien{background:#8a4fd3;}
  .ans:active{transform:scale(.95);}
  .feedback{min-height:34px; font-size:21px; font-weight:800; margin-top:18px;}
  .feedback.good{color:var(--green);}
  .feedback.bad{color:var(--red);}

  .levelrow{display:flex; gap:10px; margin:4px 0 20px;}
  .lvl{flex:1; background:var(--card); border-radius:999px; padding:12px; font-weight:800;
    font-size:16px; box-shadow:var(--shadow); opacity:.55;}
  .lvl.on{opacity:1; background:var(--blue); color:#fff;}

  .streak{font-weight:800; opacity:.55; font-size:15px; margin-top:14px;}

  /* finish screen */
  .finish{text-align:center; padding:40px 20px;}
  .finish .big{font-size:80px;}
  .finish h2{font-size:28px;}

  /* confetti */
  .confetti{position:fixed; width:12px; height:12px; top:-20px; z-index:99; border-radius:3px; pointer-events:none;
    animation:fall 1.6s ease-in forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg); opacity:.7;}}
</style>
</head>

             "when","what","one","out","today"],
  /* Little Wandle Phase 5 (Year 1) tricky words */
  year1:["their","people","oh","your","Mr","Mrs","Ms","ask","could","would","should","our",
         "house","mouse","water","want","any","many","again","who","whole","where","two","school",
         "call","different","thought","through","friend","work","once","laugh","because","eye",
         "busy","beautiful","pretty","hour","move","improve","parents","shoe"]
};

/* real-or-alien: alien words are made-up but fully decodable (like the Y1 screening check) */
const ALIEN = {
  reception:[
    ["jump",1],["frog",1],["sand",1],["moon",1],["rain",1],["spot",1],["light",1],["crab",1],
    ["vap",0],["zin",0],["dremp",0],["slimp",0],["terg",0],["snemp",0],["quib",0],["frot",0],["champ",1],["blint",0]
  ],
  year1:[
    ["play",1],["cloud",1],["dream",1],["girl",1],["smile",1],["stone",1],["chew",1],["brave",1],
    ["fape",0],["jound",0],["queep",0],["choil",0],["spron",0],["dreet",0],["plome",0],["blurst",0],["yune",0],["slue",0]
  ]
};

/* ---------- state ---------- */
const app = document.getElementById("app");
let stars = +(localStorage.getItem("bobbyStars")||0);
let readBooks = JSON.parse(localStorage.getItem("bobbyRead")||"[]");
let level = localStorage.getItem("bobbyLevel")||"year1";
let streak = 0;

function save(){
  localStorage.setItem("bobbyStars",stars);
  localStorage.setItem("bobbyRead",JSON.stringify(readBooks));
  localStorage.setItem("bobbyLevel",level);
}

/* ---------- speech ---------- */
let voice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  voice = vs.find(v=>v.name==="Daniel")||vs.find(v=>v.lang==="en-GB")||vs.find(v=>v.lang&&v.lang.startsWith("en"))||null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function say(text,rate=0.85){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(voice)u.voice=voice;
  u.lang="en-GB"; u.rate=rate; u.pitch=1.05;
  speechSynthesis.speak(u);
}

/* ---------- helpers ---------- */
function el(html){const d=document.createElement("div");d.innerHTML=html;return d.firstElementChild;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function confetti(){
  const colors=["#2244bb","#f5a623","#3aa76d","#d9534f","#8a4fd3"];
  for(let i=0;i<36;i++){
    const c=el(`<div class="confetti"></div>`);
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[i%colors.length];
    c.style.animationDelay=(Math.random()*0.5)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2300);
  }
}
function topbar(backLabel,backFn){
  const t=el(`<div class="topbar"></div>`);
  const b=el(`<button class="home-btn">‹ ${backLabel}</button>`);
  b.onclick=backFn;
  const s=el(`<div class="starpill"><span class="s">★</span> ${stars}</div>`);
  t.append(b,s); return t;
}
function addStar(n=1){ stars+=n; save(); const p=document.querySelector(".starpill"); if(p)p.innerHTML=`<span class="s">★</span> ${stars}`; }

/* ---------- screens ---------- */
function showHome(){
  speechSynthesis.cancel();
  app.innerHTML="";
  const t=el(`<div class="topbar"><div></div></div>`);
  t.append(el(`<div class="starpill"><span class="s">★</span> ${stars}</div>`));
  app.append(t);
  app.append(el(`<h1>Bobby Reads</h1>`));
  app.append(el(`<p class="subtitle">Pick a book, or play a game. Tap any word to hear it.</p>`));

  app.append(el(`<h2>Books</h2>`));
  const shelf=el(`<div class="shelf"></div>`);
  BOOKS.forEach(bk=>{
    const c=el(`<button class="cover" style="background:${bk.grad}">
      ${readBooks.includes(bk.id)?'<span class="badge">★ Read it!</span>':''}
      <span class="emoji">${bk.emoji}</span><span class="t">${bk.title}</span></button>`);
    c.onclick=()=>showBook(bk,-1);
    shelf.append(c);
  });
  app.append(shelf);

  app.append(el(`<h2>Games</h2>`));
  const row=el(`<div class="bigrow"></div>`);
  const g1=el(`<button class="bigbtn"><span class="em">🔊</span>Sound it out</button>`);
  const g2=el(`<button class="bigbtn"><span class="em">⚡</span>Tricky words</button>`);
  const g3=el(`<button class="bigbtn"><span class="em">👾</span>Real or alien?</button>`);
  const g4=el(`<button class="bigbtn"><span class="em">🔤</span>Sound cards</button>`);
  g1.onclick=()=>showBlend(); g2.onclick=()=>showTricky(); g3.onclick=()=>showAlien(); g4.onclick=()=>showSounds();
  row.append(g1,g2,g3,g4);
  app.append(row);
}

/* ----- book reader ----- */
function wordSpans(text){
  return text.split(" ").map(w=>{
    const clean=w.replace(/[^a-zA-Z'\-]/g,"");
    return `<span class="w" data-w="${clean}">${w}</span>`;
  }).join(" ");
}
function wireWords(container){
  container.querySelectorAll(".w").forEach(s=>{
    s.onclick=()=>{
      container.querySelectorAll(".w").forEach(x=>x.classList.remove("lit"));
      s.classList.add("lit");
      say(s.dataset.w,0.72);
      setTimeout(()=>s.classList.remove("lit"),900);
    };
  });
}

function showBook(bk,pageIdx){
  speechSynthesis.cancel();
  app.innerHTML="";
  app.append(topbar("Books",showHome));

  /* intro page: new words */
  if(pageIdx===-1){
    app.append(el(`<h1 style="text-align:center">${bk.emoji} ${bk.title}</h1>`));
    if(bk.newWords.length){
      app.append(el(`<p class="subtitle" style="text-align:center">New words in this book — tap to hear them:</p>`));
      const nw=el(`<div class="newwords"></div>`);
      bk.newWords.forEach(w=>{
        const b=el(`<button class="nw">${w}</button>`);
        b.onclick=()=>say(w,0.72);
        nw.append(b);
      });
      app.append(nw);
    }
    const start=el(`<div style="text-align:center;margin-top:26px"><button class="hearbtn" style="font-size:21px;padding:18px 40px">Start reading ›</button></div>`);
    start.querySelector("button").onclick=()=>showBook(bk,0);
    app.append(start);
    return;
  }

  const pg=bk.pages[pageIdx];
  const card=el(`<div class="bookpage">
      <div class="pageart">${pg.art}</div>
      <div class="pagetext">${wordSpans(pg.text)}</div>
    </div>`);
  wireWords(card);
  app.append(card);

  const ctr=el(`<div class="pagecontrols"></div>`);
  const prev=el(`<button class="navbtn">‹</button>`);
  const hear=el(`<button class="hearbtn">🔊 Read it to me</button>`);
  const next=el(`<button class="navbtn">›</button>`);
  prev.disabled=pageIdx===0;
  prev.onclick=()=>showBook(bk,pageIdx-1);
  hear.onclick=()=>say(pg.text.replace(/—/g,","),0.82);
  next.onclick=()=>{
    if(pageIdx===bk.pages.length-1) showFinish(bk);
    else showBook(bk,pageIdx+1);
  };
  ctr.append(prev,hear,next);
  app.append(ctr);

  const dots=el(`<div class="dots">${bk.pages.map((_,i)=>`<i class="${i===pageIdx?'on':''}"></i>`).join("")}</div>`);
  app.append(dots);
}

function showFinish(bk){
  speechSynthesis.cancel();
  app.innerHTML="";
  app.append(topbar("Books",showHome));
  const first=!readBooks.includes(bk.id);
  if(first){ readBooks.push(bk.id); addStar(3); } else addStar(1);
  save();
  confetti();
  const f=el(`<div class="finish">
    <div class="big">${bk.emoji}</div>
    <h2>You read the whole book, Bobby!</h2>
    <p class="subtitle" style="text-align:center">${first?"+3 stars for a brand new book! ★★★":"+1 star for reading it again! ★"}</p>
  </div>`);
  app.append(f);
  const row=el(`<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
    <button class="hearbtn" id="again">Read it again</button>
    <button class="hearbtn" id="more" style="background:var(--green)">More books ›</button></div>`);
  row.querySelector("#again").onclick=()=>showBook(bk,-1);
  row.querySelector("#more").onclick=showHome;
  app.append(row);
  say("You read the whole book, Bobby! Well done!",0.95);
}

/* ----- level toggle (shared by games) ----- */
function levelRow(onChange){
  const r=el(`<div class="levelrow">
    <button class="lvl ${level==='reception'?'on':''}" data-l="reception">Reception</button>
    <button class="lvl ${level==='year1'?'on':''}" data-l="year1">Year 1</button></div>`);
  r.querySelectorAll(".lvl").forEach(b=>b.onclick=()=>{level=b.dataset.l;save();onChange();});
  return r;
}

/* ----- game: sound it out ----- */
let blendQueue=[];
function showBlend(){
  speechSynthesis.cancel();
  app.innerHTML="";
  app.append(topbar("Home",showHome));
  app.append(el(`<h1>Sound it out</h1>`));
  app.append(el(`<p class="subtitle">Tap each sound button, blend it, then read the word out loud.</p>`));
  app.append(levelRow(showBlend));

  if(!blendQueue.length||!BLEND[level].includes(blendQueue[0])) blendQueue=shuffle(BLEND[level]);
  const raw=blendQueue[0];

  /* parse graphemes; * marks split-digraph halves that highlight together */
  const parts=raw.split("|");
  let grp=0, open=false;
  const segs=parts.map(p=>{
    const split=p.endsWith("*");
    const txt=p.replace("*","");
    let g=null;
    if(split){ if(!open){grp++;open=true;g=grp;} else {open=false;g=grp;} }
    return {txt,g};
  });
  const word=segs.map(s=>s.txt).join("");

  const card=el(`<div class="gamecard"></div>`);
  const sounds=el(`<div class="soundbtns"></div>`);
  segs.forEach(s=>{
    const b=el(`<button class="sb" data-g="${s.g||''}">${s.txt}</button>`);
    b.onclick=()=>{
      sounds.querySelectorAll(".sb").forEach(x=>x.classList.remove("lit"));
      if(s.g) sounds.querySelectorAll(`.sb[data-g="${s.g}"]`).forEach(x=>x.classList.add("lit"));
      else b.classList.add("lit");
      setTimeout(()=>sounds.querySelectorAll(".sb").forEach(x=>x.classList.remove("lit")),700);
    };
    sounds.append(b);
  });
  card.append(sounds);

  const hear=el(`<button class="hearbtn">🔊 Hear the word</button>`);
  hear.onclick=()=>say(word,0.72);
  card.append(hear);

  const row=el(`<div class="answerrow" style="margin-top:24px">
    <button class="ans good">I read it! ★</button>
    <button class="ans again">Next word ›</button></div>`);
  row.querySelector(".good").onclick=()=>{
    addStar(); streak++;
    if(streak%5===0)confetti();
    blendQueue.shift(); showBlend();
  };
  row.querySelector(".again").onclick=()=>{ streak=0; blendQueue.shift(); showBlend(); };
  card.append(row);
  card.append(el(`<div class="streak">${streak>1?streak+" in a row!":""}</div>`));
  app.append(card);
}

/* ----- game: tricky words ----- */
let trickyQueue=[];
function showTricky(){
  speechSynthesis.cancel();
  app.innerHTML="";
  app.append(topbar("Home",showHome));
  app.append(el(`<h1>Tricky words</h1>`));
  app.append(el(`<p class="subtitle">These ones break the rules — read it fast, like a flash!</p>`));
  app.append(levelRow(showTricky));

  if(!trickyQueue.length||!TRICKY[level].includes(trickyQueue[0])) trickyQueue=shuffle(TRICKY[level]);
  const word=trickyQueue[0];

  const card=el(`<div class="gamecard">
    <div class="bigword">${word}</div></div>`);
  const hear=el(`<button class="hearbtn">🔊 Hear it</button>`);
  hear.onclick=()=>say(word,0.8);
  card.append(hear);
  const row=el(`<div class="answerrow" style="margin-top:24px">
    <button class="ans good">Got it! ★</button>
    <button class="ans again">Next ›</button></div>`);
  row.querySelector(".good").onclick=()=>{ addStar(); streak++; if(streak%5===0)confetti(); trickyQueue.shift(); showTricky(); };
  row.querySelector(".again").onclick=()=>{ streak=0; trickyQueue.shift(); showTricky(); };
  card.append(row);
  card.append(el(`<div class="streak">${streak>1?streak+" in a row!":""}</div>`));
  app.append(card);
}

/* ----- sound cards (Phase 3, school catchphrases) ----- */
function showSounds(){
  speechSynthesis.cancel();
  app.innerHTML="";
  app.append(topbar("Home",showHome));
  app.append(el(`<h1>Sound cards</h1>`));
  app.append(el(`<p class="subtitle">Tap a card to hear it.</p>`));

  function soundGrid(list,speak){
    const grid=el(`<div class="shelf" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))"></div>`);
    list.forEach(([g,caption,sayText])=>{
      const c=el(`<button class="gamecard" style="padding:20px 10px">
        <div style="font-size:46px;font-weight:800;color:var(--blue)">${g}</div>
        <div style="font-size:14px;font-weight:700;opacity:.6;margin-top:6px">${caption}</div></button>`);
      c.onclick=()=>{
        c.style.outline="3px solid var(--amber)";
        speak(caption,sayText);
        setTimeout(()=>c.style.outline="",1500);
      };
      grid.append(c);
    });
    return grid;
  }

  app.append(el(`<h2>Reception sounds — school catchphrases</h2>`));
  app.append(soundGrid(SOUNDS,(phrase,word)=>say(`${phrase}. ${word}!`,0.85)));
  app.append(el(`<h2>Year 1 sounds — words to read</h2>`));
  app.append(soundGrid(SOUNDS5,(caption,words)=>say(words,0.75)));
}

/* ----- game: real or alien ----- */
let alienQueue=[];
function showAlien(){
  speechSynthesis.cancel();
  app.innerHTML="";
  app.append(topbar("Home",showHome));
  app.append(el(`<h1>Real or alien?</h1>`));
  app.append(el(`<p class="subtitle">Sound it out... is it a real word, or an alien word from space?</p>`));
  app.append(levelRow(showAlien));

  if(!alienQueue.length) alienQueue=shuffle(ALIEN[level]);
  const [word,isReal]=alienQueue[0];

  const card=el(`<div class="gamecard">
    <div class="bigword">${word}</div>
    <div class="answerrow">
      <button class="ans real">✓ Real word</button>
      <button class="ans alien">👾 Alien word</button>
    </div>
    <div class="feedback"></div></div>`);
  const fb=card.querySelector(".feedback");
  let done=false;
  function pick(saidReal){
    if(done)return; done=true;
    const right=(saidReal===!!isReal);
    if(right){
      fb.textContent=isReal?"Yes! That's a real word! ★":"Yes! That one's from outer space! ★";
      fb.className="feedback good";
      addStar(); streak++; if(streak%5===0)confetti();
    }else{
      fb.textContent=isReal?"Ooh — it's actually a real word!":"Ooh — that one's an alien word!";
      fb.className="feedback bad"; streak=0;
    }
    if(isReal)say(word,0.8);
    const n=el(`<div class="answerrow" style="margin-top:18px"><button class="ans again">Next ›</button></div>`);
    n.querySelector("button").onclick=()=>{ alienQueue.shift(); showAlien(); };
    card.append(n);
  }
  card.querySelector(".real").onclick=()=>pick(true);
  card.querySelector(".alien").onclick=()=>pick(false);
  app.append(card);
}

showHome();
</script>
</body>
</html>
